<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Waste Collection</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#17372f;background:#f1f5f1}*{box-sizing:border-box}body{margin:0}header{background:#123b30;color:white;padding:28px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}header small{color:#b9d6c0}h1{font-size:26px;margin:4px 0}main{max-width:1300px;margin:auto;padding:30px 24px}button{font:inherit;cursor:pointer;border:0;border-radius:7px;background:#176348;color:#fff;padding:10px 16px}button:hover{background:#0b4634}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#e3eee6;color:#174b36}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}.card{background:white;border:1px solid #dce5de;border-radius:12px;padding:22px}.card strong{font-size:29px;display:block;margin-top:10px}.card span{color:#5b7165}nav{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #d9e3db;padding-bottom:16px;margin-bottom:24px}nav button{background:transparent;color:#385849}nav button.active{background:#176348;color:#fff}.toolbar{display:flex;align-items:center;gap:15px;margin-bottom:18px}.toolbar h2{margin:0;flex:1}.toolbar input{max-width:300px}.panel{background:white;border:1px solid #dce5de;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:15px;border-bottom:1px solid #e8eee9;font-size:14px}th{background:#eaf1eb;font-weight:600}td small{display:block;color:#758279;margin-top:5px}.badge{border-radius:20px;padding:5px 10px;background:#eef0e8;color:#596132}.badge.paid,.badge.completed{background:#def3e7;color:#176348}.badge.pending,.badge.unpaid{background:#fff0d6;color:#8b581a}.badge.scheduled{background:#e3edff;color:#244d88}.actions button{font-size:12px;padding:7px 10px}#message{padding:12px 16px;margin-bottom:18px;border-radius:7px;background:#dff1e5}#message.error{background:#ffe7e1;color:#8b2c21}#message:empty{display:none}dialog{border:0;border-radius:14px;padding:28px;width:min(520px,95vw);box-shadow:0 20px 90px #0004}dialog::backdrop{background:#10291f88}dialog h2{margin-top:0}label{display:block;font-size:14px;font-weight:600;margin:15px 0 5px}input,select{font:inherit;border:1px solid #c6d5ca;border-radius:6px;padding:10px;width:100%;background:white}input:focus,select:focus{outline:2px solid #7eb596}.buttons{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.hint{color:#62776a;font-size:13px;line-height:1.5}.footer{margin-top:20px;color:#6d8074;font-size:13px}.empty{text-align:center;padding:35px;color:#6d8074}@media(max-width:750px){.cards{grid-template-columns:repeat(2,1fr)}header{display:block}.toolbar{flex-wrap:wrap}.toolbar input{max-width:none}h1{font-size:22px}}
</style></head><body>
<header><div><small>COMMUNITY SERVICES · KAMPALA</small><h1>Waste Collection Management</h1><small>Households, pickups and payments in one place</small></div><button id="refresh" class="secondary">Refresh records</button></header>
<main><div id="message" role="status" aria-live="polite"></div><section class="cards"><div class="card"><span>Registered households</span><strong id="householdCount">—</strong></div><div class="card"><span>Pending pickups</span><strong id="pendingCount">—</strong></div><div class="card"><span>Paid revenue · UGX</span><strong id="revenue">—</strong></div><div class="card"><span>Outstanding charges · UGX</span><strong id="outstanding">—</strong></div></section>
<nav aria-label="Records"><button data-tab="collection_requests" class="active">Pickup requests</button><button data-tab="households">Households</button><button data-tab="collectors">Collectors</button><button data-tab="payments">Payments</button></nav>
<div class="toolbar"><h2 id="title">Pickup requests</h2><input id="search" aria-label="Search records" placeholder="Search records…"><button id="add">+ New pickup request</button></div><div class="panel" id="records"><p class="empty">Connecting to your database…</p></div><p class="footer" id="connection">Local application · Records are saved to MongoDB</p></main>
<dialog id="dialog"><form id="form"><h2 id="formTitle"></h2><div id="fields"></div><p class="hint" id="formHint"></p><p id="formError" role="alert" style="color:#a32c20"></p><div class="buttons"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit" id="save">Save record</button></div></form></dialog>
<script>
const token='__TOKEN__';let data=null,editing=null,tab='collection_requests';const $=s=>document.querySelector(s);const fmt=n=>Number(n||0).toLocaleString('en-UG');const names={households:'Households',collectors:'Collectors',collection_requests:'Pickup requests',payments:'Payments'};const singular={households:'household',collectors:'collector',collection_requests:'pickup request',payments:'billing record'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function badge(s){return `<span class="badge ${esc(s)}">${esc(s)}</span>`}function labelFor(kind,id){return (data[kind].find(x=>x._id===id)||{}).name||id}
function message(s,error=false){$('#message').textContent=s;$('#message').className=error?'error':''}
async function load(){try{const r=await fetch('/api/data');const payload=await r.json();if(!r.ok)throw Error(payload.error);data=payload;$('#householdCount').textContent=data.households.length;$('#pendingCount').textContent=data.collection_requests.filter(x=>x.status==='pending').length;$('#revenue').textContent=fmt(data.payments.filter(x=>x.status==='paid').reduce((a,x)=>a+x.amount_ugx,0));$('#outstanding').textContent=fmt(data.payments.filter(x=>x.status==='unpaid').reduce((a,x)=>a+x.amount_ugx,0));$('#connection').textContent='Connected to MongoDB · '+data.database+' · Refreshed '+new Date().toLocaleTimeString();render()}catch(e){message(e.message,true);$('#records').innerHTML='<p class="empty">Database unavailable. Check MongoDB, then click Refresh records.</p>'}}
function render(){if(!data)return;$('#title').textContent=names[tab];$('#add').textContent='+ New '+singular[tab];const q=$('#search').value.toLowerCase();const rows=data[tab].filter(x=>JSON.stringify(x).toLowerCase().includes(q));let headers,body;
if(tab==='households'){headers=['Household','Area','Location','Preferred day'];body=rows.map(x=>`<tr><td>${esc(x.name)}<small>${esc(x._id)}</small></td><td>${esc(x.area)}</td><td>${esc(x.location?.zone)} · ${esc(x.location?.landmark)}</td><td>${esc(x.preferred_day)}</td></tr>`)}
if(tab==='collectors'){headers=['Collector','Service areas','Vehicle','Availability'];body=rows.map(x=>`<tr><td>${esc(x.name)}<small>${esc(x._id)}</small></td><td>${esc((x.service_areas||[]).join(', '))}</td><td>${esc(x.vehicle_code)}</td><td>${x.active?'Active':'Inactive'}</td></tr>`)}
if(tab==='collection_requests'){headers=['Request','Household','Collector','Waste','Status','Next step'];body=rows.map(x=>`<tr><td>${esc(x._id)}<small>${esc(new Date(x.requested_at).toLocaleDateString())}</small></td><td>${esc(labelFor('households',x.household_id))}</td><td>${esc(labelFor('collectors',x.collector_id))}</td><td>${esc(x.waste_type)} · ${esc(x.bags)} bag(s)</td><td>${badge(x.status)}</td><td class="actions">${x.status==='pending'?`<button data-id="${esc(x._id)}" data-status="scheduled">Schedule</button>`:x.status==='scheduled'?`<button data-id="${esc(x._id)}" data-status="completed">Complete pickup</button>`:'Completed'}</td></tr>`)}
if(tab==='payments'){headers=['Billing record','Household','Request','Amount UGX','Method','Status','Next step'];body=rows.map(x=>`<tr><td>${esc(x._id)}</td><td>${esc(labelFor('households',x.household_id))}</td><td>${esc(x.request_id)}</td><td>${fmt(x.amount_ugx)}</td><td>${esc(x.method.replaceAll('_',' '))}</td><td>${badge(x.status)}</td><td class="actions">${x.status==='unpaid'?`<button data-id="${esc(x._id)}" data-status="paid">Mark paid</button>`:'Paid'}</td></tr>`)}
headers.push('Manage');body=body.map((html,i)=>html.replace('</tr>',`<td class="actions"><button data-action="edit" data-id="${esc(rows[i]._id)}">Edit</button> <button style="background:#9b342b" data-action="delete" data-id="${esc(rows[i]._id)}">Delete</button></td></tr>`));
$('#records').innerHTML=rows.length?`<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body.join('')}</tbody></table>`:'<p class="empty">No matching records. Add a record or adjust your search.</p>';
}
function input(key,label,type='text'){return `<label for="${key}">${label}</label><input id="${key}" name="${key}" type="${type}" ${type==='number'?'min="1" max="1000000000" step="1"':'maxlength="200"'} required>`}
function select(key,label,items){return `<label for="${key}">${label}</label><select id="${key}" name="${key}" required><option value="">Choose…</option>${items.map(x=>{let [v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}">${esc(t)}</option>`}).join('')}</select>`}
function openForm(record=null){editing=record;if(!data)return message('Connect to MongoDB first.',true);$('#form').reset();$('#formError').textContent='';$('#formTitle').textContent=(editing?'Edit ':'New ')+singular[tab];let fields='',hint='';
if(tab==='households')fields=input('name','Household name')+input('area','Area')+input('zone','Zone')+input('landmark','Landmark')+select('preferred_day','Preferred pickup day',['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']);
if(tab==='collectors'){fields=input('name','Collector name')+input('service_areas','Service areas, separated by commas')+input('vehicle_code','Vehicle code');hint='A new collector starts as active. Use the same area names as the households.'}
if(tab==='collection_requests'){fields=select('household_id','Household',data.households.map(x=>[x._id,x.name+' · '+x.area]))+select('collector_id','Collector',data.collectors.filter(x=>x.active||x._id===editing?.collector_id).map(x=>[x._id,x.name+' · '+x.service_areas.join(', ')]))+select('waste_type','Waste type',['organic','mixed','plastic','paper','metal','glass'])+input('bags','Number of bags','number');hint='The collector must serve the household area. New requests start as pending; use Schedule and Complete pickup to progress them.'}
if(tab==='payments'){let available=data.collection_requests.filter(r=>!data.payments.some(p=>p.request_id===r._id&&p._id!==editing?._id));fields=select('request_id','Pickup request',available.map(r=>[r._id,r._id+' · '+labelFor('households',r.household_id)]))+input('amount_ugx','Service charge in whole Uganda shillings','number')+select('method','Payment method',['cash','mobile_money','bank_transfer'])+select('status','Payment status',['unpaid','paid']);hint='One billing record per request. This records payment status; it does not transfer money.'}
if(editing&&tab==='collectors')fields+=select('active','Availability',[['true','Active'],['false','Inactive']]);
if(editing&&tab==='collection_requests')fields+=select('status','Pickup status',['pending','scheduled','completed']);
$('#fields').innerHTML=fields;
if(editing){const values={...editing,zone:editing.location?.zone,landmark:editing.location?.landmark,service_areas:editing.service_areas?.join(', '),active:String(editing.active)};for(const el of $('#form').elements){if(el.name&&values[el.name]!==undefined)el.value=values[el.name]};hint='Edit the fields and save. Linked records are checked before changes are accepted.';}$('#formHint').textContent=hint;$('#dialog').showModal();}
async function post(action,values){const r=await fetch(`/api/${tab}/${action}`,{method:'POST',headers:{'Content-Type':'application/json','X-App-Token':token},body:JSON.stringify(values)});const result=await r.json();if(!r.ok)throw Error(result.error);return result}
$('#form').onsubmit=async e=>{e.preventDefault();$('#save').disabled=true;try{await post(editing?'edit':'create',{...Object.fromEntries(new FormData(e.target)),...(editing?{id:editing._id}:{})});$('#dialog').close();message('Record saved to MongoDB.');await load()}catch(e){$('#formError').textContent=e.message}finally{$('#save').disabled=false}};
$('#records').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;if(b.dataset.action==='edit'){openForm(data[tab].find(x=>x._id===b.dataset.id));return;}if(!confirm(`Confirm: ${b.textContent.toLowerCase()} for ${b.dataset.id}?${b.dataset.action==='delete'?' This permanently deletes the record.':''}`))return;b.disabled=true;try{await post(b.dataset.action==='delete'?'delete':'update',{id:b.dataset.id,status:b.dataset.status});message(b.dataset.action==='delete'?'Record deleted from MongoDB.':'Record updated in MongoDB.');await load()}catch(e){message(e.message,true);b.disabled=false}};
document.querySelector('nav').onclick=e=>{if(!e.target.dataset.tab)return;tab=e.target.dataset.tab;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#search').value='';render()};$('#cancel').onclick=()=>$('#dialog').close();$('#add').onclick=()=>openForm();$('#refresh').onclick=()=>{message('');load()};$('#search').oninput=render;load();
</script></body></html>
